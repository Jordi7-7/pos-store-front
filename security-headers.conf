# Cabeceras de seguridad de la web. nginx NO hereda `add_header` del servidor en un `location` que define las suyas
# (los de assets e index.html), así que este archivo se incluye en cada uno. HSTS va en el Caddy (donde termina TLS).

# Solo se ejecuta código propio. Las fuentes están autoalojadas; las imágenes del almacenamiento de la tienda (https)
# y de vistas previas locales (blob:/data:). La API cuelga del mismo origen (/api).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Sin cámara, micrófono ni ubicación; USB y puerto serie solo para esta página (impresoras térmicas y de etiquetas)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(self), serial=(self)" always;
